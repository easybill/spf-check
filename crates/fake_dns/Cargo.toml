[package]
name = "fake_dns"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal DNS server on localhost that answers TXT queries from a fixed zone. For tests only."

[dependencies]
tokio = { version = "1.52.1", features = ["net", "rt"] }
trust-dns-proto = "0.23.2"
trust-dns-resolver = { version = "0.23.2", features = ["tokio-runtime"] }
